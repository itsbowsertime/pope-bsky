name: live
on:
  schedule:
    - cron: "2,32 * * * *" # every 30 minutes, a few minutes before X's timeline resets (~:10, :40); GitHub often runs late
  workflow_dispatch: {}
concurrency: live # never two runs at once, so nothing posts twice
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: New @Pontifex tweets → Bluesky (long ones via a Todoist screenshot)
        run: node live.mjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
