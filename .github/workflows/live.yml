name: live
# Started every 30 minutes (:02 and :32) by the Cloudflare Worker in cloudflare/
# — GitHub's own schedule dropped most runs (2 of ~20 on 2026-10-03).
on:
  workflow_dispatch: {}
concurrency: live # never two runs at once, so nothing posts twice
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: New @Pontifex tweets → Bluesky (long ones via a Todoist screenshot)
        run: node live.mjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}
