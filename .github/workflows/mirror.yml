name: mirror
on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes (GitHub may run it a few minutes late)
  workflow_dispatch: {}
concurrency: mirror # never two runs at once, so nothing posts twice
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vatican News stories
        run: node mirror.mjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
      - name: Repost confirmed @Pontifex screenshots
        if: always() # a hiccup in one step shouldn't stop the other
        run: node screenshots.mjs
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
